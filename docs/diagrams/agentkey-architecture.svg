<text x='380.0' y='164' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2328'>agentkey: the identity library (own repo, npm, Apache-2.0)</text>
<text x='380.0' y='180' text-anchor='middle' font-size='11.5' fill='#57606a'>one Ed25519 key per agent role; binds to an SSH key or Sigstore; signs receipts</text>
