<text x='628.5' y='268' text-anchor='middle' font-size='11.5' fill='#57606a'>signs L2 with Sigstore</text>
<rect x='24' y='330' width='213' height='72' rx='8' fill='#1f6feb' fill-opacity='0.10' stroke='#1f6feb' stroke-width='2'/>
