<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 470' width='760' height='470' role='img' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs>
<rect width='760' height='470' fill='white'/>
<text x='24' y='28' font-size='15' font-weight='600' fill='#1f2328'>One key per agent role; a signature is upgraded by binding, never by a new key</text>
<rect x='24' y='56' width='150' height='120' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
<text x='99.0' y='80' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Roles</text>
<text x='99.0' y='98' text-anchor='middle' font-size='11.5' fill='#57606a'>claude-code</text>
<text x='99.0' y='114' text-anchor='middle' font-size='11.5' fill='#57606a'>codex · cursor</text>
<text x='99.0' y='130' text-anchor='middle' font-size='11.5' fill='#57606a'>crewai/&lt;worker&gt;</text>
<text x='99.0' y='146' text-anchor='middle' font-size='11.5' fill='#57606a'>ci (keyless, no file)</text>
<rect x='214' y='56' width='170' height='120' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
<text x='299.0' y='80' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Key files</text>
<text x='299.0' y='98' text-anchor='middle' font-size='11.5' fill='#57606a'>~/.config/agentkey/keys/</text>
<text x='299.0' y='114' text-anchor='middle' font-size='11.5' fill='#57606a'>&lt;role&gt;.key  (PKCS8, 0600)</text>
<text x='299.0' y='130' text-anchor='middle' font-size='11.5' fill='#57606a'>&lt;role&gt;.pub</text>
<text x='299.0' y='146' text-anchor='middle' font-size='11.5' fill='#57606a'>revoked.txt · not_after</text>
<rect x='424' y='56' width='140' height='120' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
<text x='494.0' y='80' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>kid</text>
<text x='494.0' y='98' text-anchor='middle' font-size='11.5' fill='#57606a'>&quot;k&quot; + sha256(pub)[:16]</text>
<text x='494.0' y='114' text-anchor='middle' font-size='11.5' fill='#57606a'>same scheme as</text>
<text x='494.0' y='130' text-anchor='middle' font-size='11.5' fill='#57606a'>hivevault replica keys</text>
<rect x='604' y='56' width='132' height='120' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
<text x='670.0' y='80' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>run_id</text>
<text x='670.0' y='98' text-anchor='middle' font-size='11.5' fill='#57606a'>per run, inside</text>
<text x='670.0' y='114' text-anchor='middle' font-size='11.5' fill='#57606a'>the signed payload</text>
<text x='670.0' y='130' text-anchor='middle' font-size='11.5' fill='#57606a'>never a new key</text>
<path d='M174 116H214' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M384 116H424' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M564 116H604' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<rect x='214' y='220' width='350' height='88' rx='8' fill='#1f6feb' fill-opacity='0.10' stroke='#1f6feb' stroke-width='2'/>
<text x='389.0' y='244' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>DSSE envelope (in-toto Statement v1 inside)</text>
<text x='389.0' y='262' text-anchor='middle' font-size='11.5' fill='#57606a'>payloadType · payload · signatures[{keyid: kid, sig}]</text>
<text x='389.0' y='278' text-anchor='middle' font-size='11.5' fill='#57606a'>PAE(&quot;DSSEv1&quot;, type, payload) · Ed25519</text>
<text x='389.0' y='294' text-anchor='middle' font-size='11.5' fill='#57606a'>exactly one signature per envelope</text>
<path d='M299 176V220' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M494 176V220' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<rect x='24' y='360' width='213' height='72' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
<text x='130.5' y='384' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>SSH binding (optional)</text>
<text x='130.5' y='402' text-anchor='middle' font-size='11.5' fill='#57606a'>ssh-keygen -Y sign -n agentkey</text>
<text x='130.5' y='418' text-anchor='middle' font-size='11.5' fill='#57606a'>principal · allowed_signers → bound</text>
<rect x='273' y='360' width='213' height='72' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
<text x='379.5' y='384' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Sigstore keyless (CI)</text>
<text x='379.5' y='402' text-anchor='middle' font-size='11.5' fill='#57606a'>OIDC → Fulcio cert → Rekor</text>
<text x='379.5' y='418' text-anchor='middle' font-size='11.5' fill='#57606a'>or SIGSTORE_ID_TOKEN → L2</text>
<rect x='522' y='360' width='213' height='72' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
<text x='628.5' y='384' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Verifiers</text>
<text x='628.5' y='402' text-anchor='middle' font-size='11.5' fill='#57606a'>proofline verify-receipt · cosign</text>
<text x='628.5' y='418' text-anchor='middle' font-size='11.5' fill='#57606a'>hivevault receipts verify · exit 0/1/2</text>
<path d='M130 360V290H214' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M380 360V308' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M564 264H628V360' fill='none' stroke='#8c959f' stroke-width='1.25' marker-end='url(#a)'/>
<text x='40' y='340' text-anchor='start' font-size='11.5' fill='#57606a'>raises L1 trust: bound</text>
<text x='388' y='340' text-anchor='start' font-size='11.5' fill='#57606a'>replaces the laptop key in CI</text>
<text x='736' y='340' text-anchor='end' font-size='11.5' fill='#57606a'>exit 2 on an unknown or revoked kid</text>
</svg>
